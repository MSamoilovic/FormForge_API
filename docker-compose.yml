version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: formforge_db
    restart: unless-stopped

    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-formforge_db}
    # No volume: data lives only as long as the container (lost on `docker compose down`).
    # No host port: the DB is reachable only from the API container (db:5432),
    # so it never clashes with a local Postgres used for development.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - formforge-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formforge_api
    restart: unless-stopped

    env_file:
      - .env
    environment:
      # Inside the Docker network the API talks to the `db` container on 5432,
      # regardless of DB_HOST/DB_PORT in .env (which point to the local dev DB).
      DB_HOST: db
      DB_PORT: "5432"

    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - formforge-network
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

networks:
  formforge-network:
    driver: bridge
