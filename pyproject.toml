[project]
name = "formforge-api"
version = "0.1.0"
description = "Backend Service for FormForge"
authors = [
    { name = "Marko Samoilovic", email = "msamoilovic@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "sqlalchemy>=2.0.43",
    "asyncpg>=0.30.0",
    "alembic>=1.16.5",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.0.0",
    "openpyxl>=3.1.0",
    "openai>=2.46.0",
]

[project.scripts]
dev = "scripts:run_dev"
seed = "scripts:seed_db"
reset-db = "scripts:reset_db"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "DTZ",  # flake8-datetimez (naive datetime)
    "BLE",  # blind except
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "RUF",  # ruff-specific
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in default arguments.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "app.core.security.require_role",
    "app.core.security.require_scope",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
